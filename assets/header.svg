<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#123b34"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#3fb68b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb68b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="18" fill="url(#glow)"/>

  <!-- network motif -->
  <g stroke="#7fd8b6" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M880 70 L960 120 L1060 90 L1120 160 L1010 200 L930 180 Z"/>
    <path d="M960 120 L1010 200 M1060 90 L1010 200 M880 70 L930 180"/>
  </g>
  <g fill="#7fd8b6">
    <circle cx="880" cy="70" r="5"/><circle cx="960" cy="120" r="7"/><circle cx="1060" cy="90" r="5"/>
    <circle cx="1120" cy="160" r="6"/><circle cx="1010" cy="200" r="8" fill="#3fb68b"/><circle cx="930" cy="180" r="5"/>
  </g>

  <text x="64" y="108" font-size="46" font-weight="700" fill="#ffffff">Jasper Chinedu Nwangere</text>
  <text x="64" y="152" font-size="23" font-weight="500" fill="#7fd8b6">AI / ML Engineer  ·  Software Developer</text>
  <text x="64" y="196" font-size="18" fill="#c9d6d2">Computer vision, LLM systems and production machine learning,</text>
  <text x="64" y="222" font-size="18" fill="#c9d6d2">built to be measured, explained and trusted.</text>
  <text x="64" y="256" font-size="14" fill="#8fa39d" letter-spacing="1.5">BIRMINGHAM, UK  ·  MSC COMPUTER SCIENCE, ULSTER UNIVERSITY  ·  OPEN TO WORK</text>
</svg>
